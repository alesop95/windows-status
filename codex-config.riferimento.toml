# =============================================================================
#  Configurazione Codex CLI di riferimento — versionata, nessun valore reale
#
#  Copiata in ogni radice <PROFILO_UTENTE>\.codex-account<N>\config.toml da
#  scripts\Installa-Codex.ps1. E' la fonte di verita': una radice si ricostruisce
#  da qui, non si copia da un'altra macchina.
#
#  Documentazione: docs\10_CODEX_CLI_E_WORKSPACE_OPENAI.md, sezione 3.4.
#  Validata con `codex --strict-config doctor` su codex-cli 0.155.1.
#
#  ORDINE DEL FILE, da non alterare: in TOML ogni chiave scritta dopo
#  l'intestazione di una tabella appartiene a quella tabella. Le chiavi di primo
#  livello stanno quindi TUTTE in cima, prima della prima intestazione, e le
#  tabelle seguono. Invertire l'ordine non produce un errore di sintassi ma una
#  configurazione diversa da quella che sembra scritta.
# =============================================================================

# --- Chiavi di primo livello ------------------------------------------------
# Perimetro di esecuzione. Corrisponde alla whitelist dell'altro agente da
# terminale: le operazioni sicure sono ammesse, quelle verso l'esterno restano
# manuali. Commit, push e deploy non sono mai automatici.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

# --- Prevenzione ------------------------------------------------------------
# Evitare di scrivere e' preferibile a pulire dopo: non dipende dal momento in
# cui qualcosa viene eseguito, quindi non ha finestre scoperte.

[history]
persistence = "none"

[analytics]
enabled = false

[otel]
exporter = "none"
log_user_prompt = false

# --- Memoria nascosta: spenta esplicitamente --------------------------------
# Il principio e' quello del sistema di progetto portabile: l'unica memoria
# legittima e' quella versionata dentro la cartella di progetto. Una memoria per
# utente, non ispezionabile e fuori dal repository, non e' una variante di quel
# principio ma la sua negazione.
# Il flag risulta gia' `false` per default in codex-cli 0.155.1, ma si fissa qui
# perche' un default puo' cambiare con un aggiornamento senza che nessuno se ne
# accorga, ed e' precisamente il tipo di cambiamento che non emette errori.

[features]
memories = false

# --- Isolamento per progetto ------------------------------------------------
# Codex non partiziona per progetto: la separazione si ottiene sul filesystem,
# vincolando una sessione alla propria cartella di lavoro. `writable_roots` vuoto
# significa "nessuna radice scrivibile oltre al workspace corrente", quindi una
# sessione aperta su un progetto non raggiunge gli altri.
#
# Verifica empirica del 2026-09-21, su Windows 11:
#   DIMOSTRATO  la sandbox e' realmente applicata. Una scrittura fuori perimetro
#               fallisce con UnauthorizedAccessException del sistema operativo,
#               non con un messaggio dell'applicazione. Di conseguenza la voce
#               `sandbox backend disabled` della diagnosi NON significa assenza
#               di protezione, ed e' fuorviante.
#   NON DIMOSTRATO  quale radice risulti scrivibile durante una sessione reale.
#               Il sottocomando `codex sandbox` blocca ogni scrittura, compresa
#               la cartella corrente, anche forzando `-s workspace-write`, quindi
#               non e' il banco di prova adatto: va verificato dentro una sessione
#               vera su un progetto vero.

[sandbox_workspace_write]
writable_roots = []
network_access = false
